name: Build, Test, and Debian Package

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-deb:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu-24.04
            image: ubuntu:24.04
            artifact_suffix: ubuntu24.04
          - distro: debian-bookworm
            image: debian:bookworm
            artifact_suffix: debian12
          - distro: debian-trixie
            image: debian:trixie
            artifact_suffix: debian13
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install build & packaging dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            git \
            cmake \
            g++ \
            pkgconf \
            debhelper \
            dpkg-dev \
            libfcitx5core-dev \
            libfcitx5config-dev \
            libfcitx5utils-dev \
            fcitx5-modules-dev \
            fcitx5 \
            libcurl4-openssl-dev \
            nlohmann-json3-dev \
            qt6-base-dev \
            libsqlite3-dev \
            zlib1g-dev

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure and build (with tests)
        run: |
          cmake -S . -B build -DBUILD_TESTS=ON
          cmake --build build -j

      - name: Run CTest suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure -V

      - name: Build standard .deb package
        run: |
          rm -rf build
          dpkg-buildpackage -us -uc -b
          mkdir -p dist
          mv ../fcitx5-shadowbar_*.deb dist/
          ls -lh dist/
          dpkg-deb -I dist/fcitx5-shadowbar_*.deb
          dpkg-deb -c dist/fcitx5-shadowbar_*.deb

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: fcitx5-shadowbar-${{ matrix.artifact_suffix }}
          path: dist/*.deb

  build-llama-server:
    runs-on: ubuntu-24.04
    container:
      image: debian:bookworm

    steps:
      - name: Install build & Vulkan toolchain dependencies
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            git \
            cmake \
            g++ \
            pkgconf \
            binutils \
            libvulkan-dev \
            glslc \
            glslang-tools

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build patched llama-server (Q2_0C + Vulkan)
        env:
          GGML_VULKAN: "ON"
          GGML_NATIVE: "OFF"
        run: |
          mkdir -p dist
          chmod +x scripts/build_llama_server.sh
          ./scripts/build_llama_server.sh dist/llama-server
          ldd dist/llama-server
          tar -C dist -czf dist/shadowbar-llama-server-linux-amd64.tar.gz llama-server
          (cd dist && sha256sum shadowbar-llama-server-linux-amd64.tar.gz > shadowbar-llama-server-linux-amd64.tar.gz.sha256)
          ls -lh dist/

      - name: Upload llama-server engine tarball
        uses: actions/upload-artifact@v4
        with:
          name: shadowbar-llama-server-linux-amd64
          path: |
            dist/shadowbar-llama-server-linux-amd64.tar.gz
            dist/shadowbar-llama-server-linux-amd64.tar.gz.sha256

  release:
    needs: [build-test-deb, build-llama-server]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          ls -lh release-assets/
          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" release-assets/* --clobber
          else
            gh release create "${TAG_NAME}" release-assets/* \
              --title "${TAG_NAME}" \
              --generate-notes
          fi
